<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shrek Quiz Ultimate</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:system-ui,Arial;background:radial-gradient(circle at top,#527d32,#102313 42%,#061009);color:#f5f9e9}
.wrap{max-width:700px;margin:auto;padding:16px}
.hero{text-align:center;padding:20px 0}
.logo{font-size:42px;font-weight:1000;text-shadow:0 4px #18300e}
.logo small{display:block;font-size:16px;color:#d0dda9;margin-top:5px}
.panel{background:#0c1b10ee;border:1px solid #526d39;border-radius:22px;padding:18px;box-shadow:0 15px 40px #0008}
.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.pill{background:#1c3018;border:1px solid #4f6b39;border-radius:999px;padding:8px 13px}
.progress{height:10px;background:#1d2b1b;border-radius:20px;overflow:hidden;margin:12px 0 20px}
#bar{height:100%;width:0;background:#80b844;transition:.25s}
#question{font-size:25px;font-weight:900;line-height:1.6;margin:12px 0 20px}
.answers{display:grid;gap:10px}
.answer{background:#263d20;color:#fff;border:1px solid #536c3e;border-radius:14px;padding:14px;text-align:right;font-weight:700}
.answer:active{transform:scale(.98)}
.correct{background:#287c4c!important}.wrong{background:#8d3e46!important}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}
button{font:inherit;cursor:pointer}
.action{background:#5d8c32;color:white;border:0;border-radius:13px;padding:11px 16px;font-weight:900}
.secondary{background:#263a22;color:white;border:1px solid #587442;border-radius:13px;padding:11px 16px}
#result{display:none;text-align:center}
.big{font-size:48px;font-weight:1000}
.trophy{font-size:70px}
.review{margin-top:15px;color:#b9c9a2;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><div class="logo">🟢 SHREK QUIZ</div><small>نسخه Ultimate • ۵۰ سؤال شرکی</small></div>
<div class="panel" id="quiz">
<div class="stats"><div class="pill">🧅 امتیاز: <b id="score">0</b></div><div class="pill">❓ سؤال: <b id="num">1</b>/50</div><div class="pill">🏆 رکورد: <b id="best">0</b></div></div>
<div class="progress"><div id="bar"></div></div>
<div id="question"></div>
<div id="answers" class="answers"></div>
<div class="actions"><button class="secondary" onclick="restart()">🔄 شروع دوباره</button><button class="secondary" onclick="goHome()">🏠 صفحه اصلی</button></div>
</div>
<div class="panel" id="result">
<div class="trophy" id="trophy">🏆</div>
<div class="big" id="final"></div>
<p id="message"></p>
<div class="review" id="review"></div>
<div class="actions"><button class="action" onclick="restart()">🧅 دوباره بازی کن</button><button class="secondary" onclick="goHome()">🏠 صفحه اصلی</button></div>
</div>
</div>
<script>
const questions=[["نام اصلی سازنده این تست چیست؟", ["محمدرضا", "امیرحسین", "علی, "رضا"], 2], ["اسم الاغ در مجموعه شرک چیست؟", ["Puss", "Farquaad", "Dragon", "Donkey"], 3], ["شرک معمولاً کجا زندگی می‌کند؟", ["قلعه", "هتل", "مدرسه", "باتلاق"], 3], ["نام شاهزاده خانمی که شرک با او آشنا می‌شود چیست؟", ["Fiona", "Doris", "Gwen", "Lillian"], 0], ["نام شاهزاده‌ای که در فیلم اول قرار است با فیونا ازدواج کند چیست؟", ["Farquaad", "Harold", "Charming", "Arthur"], 0], ["لرد فارکواد بر چه سرزمینی حکومت می‌کند؟", ["Halloween Town", "Duloc", "Swamp", "Far Far Away"], 1], ["شخصیت سبز و غول‌مانند اصلی داستان چه نام دارد؟", ["Shrek", "Hiccup", "Hulk", "Grinch"], 0], ["چه کسی در فیلم اول با شرک دوست می‌شود؟", ["گربه", "اژدها", "شاه", "خر"], 3], ["نام گربه شمشیرزن مجموعه شرک چیست؟", ["Tom", "Puss in Boots", "Felix", "Boots"], 1], ["گربه چکمه‌پوش معمولاً چه چیزی به سر دارد؟", ["تاج", "عینک", "کلاه", "کلاه ایمنی"], 2], ["فیونا در شب چه تغییری می‌کند؟", ["تبدیل به انسان نامرئی", "تبدیل به اژدها", "تبدیل به غول", "تبدیل به پری"], 2], ["شرک چه رنگی است؟", ["آبی", "سبز", "قرمز", "بنفش"], 1], ["دوست صمیمی پرحرف شرک کیست؟", ["خر", "پینوکیو", "شاه", "گربه"], 0], ["نام پدر فیونا چیست؟", ["Arthur", "Merlin", "Harold", "Farquaad"], 2], ["نام مادر فیونا چیست؟", ["Lillian", "Doris", "Fiona", "Gingy"], 0], ["نام شهر لرد فارکواد چیست؟", ["Swamp City", "Far Far Away", "Duloc", "Dragonland"], 2], ["کدام شخصیت یک اژدهاست؟", ["Fiona", "Donkey", "Dragon", "Gingy"], 2], ["خر با چه موجودی رابطه عاشقانه پیدا می‌کند؟", ["اژدها", "غول", "اسب", "گربه"], 0], ["نام یکی از بچه‌های خر و اژدها چیست؟", ["Dronkeys", "Ogres", "Dragons Jr", "Shreklings"], 0], ["در داستان شرک، مرد کلاه‌قرمز معمولاً با چه چیزی شناخته می‌شود؟", ["عینک", "تاج", "شمشیر", "کلاه قرمز"], 3], ["Gingy چیست؟", ["اژدها", "غول", "آدمک زنجبیلی", "خر"], 2], ["شخصیت Pinocchio چه ویژگی عجیبی دارد؟", ["تبدیل به اژدها می‌شود", "پرواز می‌کند", "نامرئی می‌شود", "بینی‌اش با دروغ گفتن بزرگ می‌شود"], 3], ["نام شاهزاده‌ای که در Shrek 2 ظاهر می‌شود چیست؟", ["Prince Charming", "Prince Harold", "Prince Duloc", "Prince Arthur"], 0], ["مادرخوانده پری در داستان چه نوع شخصیتی است؟", ["Dragon", "Witch", "Fairy Godmother", "Queen"], 2], ["فیونا و شرک پس از ازدواج چه نوع خانواده‌ای تشکیل می‌دهند؟", ["خانواده غول‌ها", "خانواده اژدها", "خانواده پادشاهی انسان‌ها", "خانواده پری‌ها"], 0], ["نام پادشاهی محل زندگی خانواده فیونا چیست؟", ["Duloc", "Dreamland", "Far Far Away", "Swamp"], 2], ["شرک در ابتدا از چه چیزی بیشتر لذت می‌برد؟", ["رقص در قصر", "جنگیدن با اژدها", "تنهایی در باتلاق", "زندگی در شهر"], 2], ["چه کسی در Shrek 2 به شرک و خر کمک می‌کند؟", ["Gingy", "Farquaad", "Puss in Boots", "Harold"], 2], ["Puss in Boots از چه چیزی به عنوان سلاح استفاده می‌کند؟", ["شمشیر", "کمان", "چکش", "نیزه"], 0], ["نام گربه شمشیرزن به چه چیزی اشاره دارد؟", ["تاجش", "شمشیرش", "چکمه‌هایش", "کلاهش"], 2], ["شرک و خر در فیلم اول برای نجات چه کسی به قلعه می‌روند؟", ["لیلیان", "اژدها", "دوریس", "فیونا"], 3], ["چه موجودی از قلعه فیونا محافظت می‌کند؟", ["غول", "گرگ", "خرس", "اژدها"], 3], ["خر در ابتدا هنگام فرار با شرک چگونه با او ارتباط می‌گیرد؟", ["ساکت می‌ماند", "آواز می‌خواند", "می‌رقصد", "مدام حرف می‌زند"], 3], ["شرک معمولاً به عنوان چه نوع موجودی شناخته می‌شود؟", ["Wizard", "Troll", "Ogre", "Elf"], 2], ["در دنیای شرک، Far Far Away بیشتر شبیه چیست؟", ["یک جنگل", "یک باتلاق", "یک پادشاهی", "یک روستا"], 2], ["چه کسی پادشاه هارولد را در داستان می‌شناسد؟", ["پینوکیو", "گینگى", "فیونا", "لرد فارکواد"], 2], ["کدام شخصیت یک آدمک زنجبیلی است؟", ["Puss", "Shrek", "Gingy", "Donkey"], 2], ["کدام شخصیت معمولاً شوخی و حرف زیاد دارد؟", ["Donkey", "Dragon", "Farquaad", "Harold"], 0], ["شرک برای نجات باتلاقش مجبور می‌شود با چه کسی همکاری کند؟", ["Harold", "Arthur", "Donkey", "Charming"], 2], ["کدام شخصیت چکمه پوش است؟", ["Gingy", "Donkey", "Puss", "Shrek"], 2], ["در داستان، فیونا چه راز مهمی دارد؟", ["جادوگر است", "اژدهاست", "نامرئی می‌شود", "شب‌ها به غول تبدیل می‌شود"], 3], ["چه کسی در Shrek 2 تلاش می‌کند شرک را از فیونا جدا کند؟", ["Gingy", "Dragon", "Fairy Godmother", "Donkey"], 2], ["کدام شخصیت پدر فیوناست؟", ["Prince Charming", "King Harold", "Lord Farquaad", "King Arthur"], 1], ["کدام شخصیت مادر فیوناست؟", ["Queen Lillian", "Dragon", "Fairy Godmother", "Doris"], 0], ["کدام فیلم پس از Shrek 2 ساخته شد؟", ["Shrek 5", "Shrek the Third", "Shrek Returns", "Shrek Forever After"], 1], ["کدام فیلم عنوان «Forever After» را دارد؟", ["فیلم سوم", "فیلم دوم", "فیلم چهارم", "فیلم اول"], 2], ["عنوان فیلم اول مجموعه چیست؟", ["Shrek", "Shrek Forever After", "Shrek 2", "Shrek the Third"], 0], ["عنوان فیلم دوم چیست؟", ["Shrek Returns", "Shrek 2", "Shrek Forever", "Shrek Again"], 1], ["عنوان فیلم سوم چیست؟", ["The Third Ogre", "Shrek the Third", "Shrek 3D", "Shrek Again"], 1], ["در فیلم چهارم، شرک بیشتر آرزوی چه چیزی را دارد؟", ["پرواز کردن", "پادشاه شدن", "داشتن قلعه بزرگ", "بازگشت به زندگی ساده و باتلاقش"], 3], ["یکی از تم‌های مهم داستان شرک چیست؟", ["قهرمان شدن به هر قیمت", "زندگی در شهر", "ثروتمند شدن", "پذیرفتن خود واقعی"], 3], ["پیام کلی بسیاری از داستان‌های شرک درباره چیست؟", ["جادو همیشه بد است", "ظاهر همه‌چیز نیست", "تنهایی بهترین انتخاب است", "قدرت مهم‌تر از دوستی است"], 1]];
let index=0,score=0,answered=false;
let best=Number(localStorage.getItem('shrekQuizBest')||0);
document.getElementById('best').textContent=best;
function show(){
 answered=false;
 const q=questions[index];
 document.getElementById('num').textContent=index+1;
 document.getElementById('bar').style.width=((index)/questions.length*100)+'%';
 document.getElementById('question').textContent=q[0];
 const a=document.getElementById('answers');a.innerHTML='';
 q[1].forEach((text,i)=>{
  const b=document.createElement('button');b.className='answer';b.textContent=text;
  b.onclick=()=>answer(i,b);a.appendChild(b);
 });
}
function answer(i,b){
 if(answered)return; answered=true;
 const q=questions[index];
 document.querySelectorAll('.answer').forEach(x=>x.disabled=true);
 if(i===q[2]){b.classList.add('correct');score++;document.getElementById('score').textContent=score}
 else{b.classList.add('wrong');document.querySelectorAll('.answer')[q[2]].classList.add('correct')}
 setTimeout(()=>{index++;if(index<questions.length)show();else finish()},650);
}
function finish(){
 document.getElementById('quiz').style.display='none';
 document.getElementById('result').style.display='block';
 document.getElementById('bar').style.width='100%';
 document.getElementById('final').textContent=score+' / '+questions.length;
 let pct=score/questions.length;
 document.getElementById('trophy').textContent=pct===1?'👑':pct>=.8?'🏆':pct>=.6?'🥇':pct>=.4?'🥈':'🧅';
 document.getElementById('message').textContent=pct===1?'باورنکردنی! استاد دنیای شرک هستی!':pct>=.8?'عالی بود! تقریباً مثل خود شرک بلدی!':pct>=.6?'خوبه! هنوز چند راز باتلاق مونده.':pct>=.4?'بد نیست؛ یک دور دیگه امتحان کن!':'به باتلاق برگرد و دوباره تمرین کن! 😄';
 if(score>best){best=score;localStorage.setItem('shrekQuizBest',best);document.getElementById('best').textContent=best}
 document.getElementById('review').textContent='در هر سؤال فقط یک پاسخ درست وجود دارد. گزینه‌ها هر بار جابه‌جا می‌شوند.';
}
function restart(){index=0;score=0;document.getElementById('score').textContent=0;document.getElementById('quiz').style.display='block';document.getElementById('result').style.display='none';show()}
function goHome(){location.reload()}
show();
</script>
</body>
</html>
